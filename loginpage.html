<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Login Form</h2>

        <form>
            <input type="text" placeholder="Enter Username"><br>

            <input type="password" placeholder="Enter Password"><br>

            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
